<h1>Функции и <em>графики</em></h1>
<p class="lead">Тренажёр на задание №11 ОГЭ по математике: даны 3 функции (А, Б, В) и 3 графика. Установи соответствие между ними.</p>

<script>
// Базовая SVG-функция: рисует график y = fn(x) на области [xMin, xMax] × [yMin, yMax]
function plotFn(fn, xMin, xMax, yMin, yMax){
  const W = 200, H = 180;
  const PAD = 14;
  const innerW = W - 2*PAD, innerH = H - 2*PAD;
  const xToPx = x => PAD + (x - xMin) / (xMax - xMin) * innerW;
  const yToPx = y => PAD + (yMax - y) / (yMax - yMin) * innerH;

  let path = '';
  const N = 200;
  let started = false;
  for(let i = 0; i <= N; i++){
    const x = xMin + (xMax - xMin) * i / N;
    let y;
    try { y = fn(x); } catch(e) { continue; }
    if(!isFinite(y) || y < yMin - 5 || y > yMax + 5){ started = false; continue; }
    const px = xToPx(x), py = yToPx(y);
    path += (started ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1) + ' ';
    started = true;
  }

  const x0 = xToPx(0), y0 = yToPx(0);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="white"/>
    <line x1="${PAD}" y1="${y0}" x2="${W-PAD}" y2="${y0}" stroke="#D6D0BF" stroke-width="0.8"/>
    <line x1="${x0}" y1="${PAD}" x2="${x0}" y2="${H-PAD}" stroke="#D6D0BF" stroke-width="0.8"/>
    <text x="${x0+4}" y="${PAD+10}" font-size="10" fill="#6B6B6B" font-family="JetBrains Mono">y</text>
    <text x="${W-PAD-10}" y="${y0-4}" font-size="10" fill="#6B6B6B" font-family="JetBrains Mono">x</text>
    <text x="${x0+4}" y="${y0+12}" font-size="10" fill="#6B6B6B" font-family="JetBrains Mono">0</text>
    <text x="${xToPx(1)-3}" y="${y0+12}" font-size="9" fill="#6B6B6B" font-family="JetBrains Mono">1</text>
    <text x="${x0+4}" y="${yToPx(1)+3}" font-size="9" fill="#6B6B6B" font-family="JetBrains Mono">1</text>
    <line x1="${xToPx(1)}" y1="${y0-3}" x2="${xToPx(1)}" y2="${y0+3}" stroke="#6B6B6B"/>
    <line x1="${x0-3}" y1="${yToPx(1)}" x2="${x0+3}" y2="${yToPx(1)}" stroke="#6B6B6B"/>
    <path d="${path}" fill="none" stroke="#2D4A2B" stroke-width="1.6"/>
  </svg>`;
}

// Каждое задание: 3 функции (с TeX и js fn) + правильный порядок [graph_for_A, graph_for_B, graph_for_C]
// Графики автоматически генерируются из функций; правильный ответ — какая функция (A/Б/В) под каким графиком (1/2/3)
const QUESTIONS = [
  { id:'fg1',
    fns:[
      { letter:'А', tex:'y = 2x^2 + 16x + 29', fn:x => 2*x*x + 16*x + 29, range:[-7, 1, -5, 15] },
      { letter:'Б', tex:'y = \\dfrac{5}{3}x + 6', fn:x => 5/3*x + 6, range:[-4, 4, -3, 12] },
      { letter:'В', tex:'y = -\\dfrac{4}{x}', fn:x => -4/x, range:[-5, 5, -8, 8] }
    ],
    answer:[1, 3, 2],  // А→1, Б→3, В→2
    note:'А — парабола (квадратичная); Б — прямая (линейная); В — гипербола (обратная пропорциональность). Привязка к графикам по характерному виду каждой кривой.'
  },
  { id:'fg2',
    fns:[
      { letter:'А', tex:'y = x^2 - 4', fn:x => x*x - 4, range:[-4, 4, -5, 12] },
      { letter:'Б', tex:'y = -2x + 1', fn:x => -2*x + 1, range:[-3, 4, -7, 7] },
      { letter:'В', tex:'y = \\dfrac{6}{x}', fn:x => 6/x, range:[-5, 5, -10, 10] }
    ],
    answer:[1, 2, 3],
    note:'А — парабола (ветви вверх, вершина в (0; -4)); Б — прямая с отрицательным наклоном; В — гипербола в I и III квадрантах.'
  },
  { id:'fg3',
    fns:[
      { letter:'А', tex:'y = -x^2 + 2x', fn:x => -x*x + 2*x, range:[-2, 4, -5, 2] },
      { letter:'Б', tex:'y = \\dfrac{3}{x}', fn:x => 3/x, range:[-5, 5, -8, 8] },
      { letter:'В', tex:'y = \\dfrac{1}{2}x - 2', fn:x => 0.5*x - 2, range:[-2, 6, -4, 2] }
    ],
    answer:[1, 3, 2],
    note:'А — парабола (ветви вниз); Б — гипербола в I и III квадрантах; В — прямая с положительным наклоном.'
  },
  { id:'fg4',
    fns:[
      { letter:'А', tex:'y = -\\dfrac{6}{x}', fn:x => -6/x, range:[-5, 5, -10, 10] },
      { letter:'Б', tex:'y = x^2 + 2x - 3', fn:x => x*x + 2*x - 3, range:[-5, 3, -5, 8] },
      { letter:'В', tex:'y = 3x + 2', fn:x => 3*x + 2, range:[-3, 3, -7, 11] }
    ],
    answer:[3, 1, 2],
    note:'А — гипербола в II и IV квадрантах (ветви в "минусовых" четвертях); Б — парабола ветви вверх; В — прямая с положительным наклоном.'
  },
  { id:'fg5',
    fns:[
      { letter:'А', tex:'y = (x-2)^2', fn:x => (x-2)*(x-2), range:[-2, 6, -1, 16] },
      { letter:'Б', tex:'y = -x + 3', fn:x => -x + 3, range:[-3, 5, -3, 7] },
      { letter:'В', tex:'y = \\dfrac{8}{x}', fn:x => 8/x, range:[-6, 6, -10, 10] }
    ],
    answer:[1, 2, 3],
    note:'А — парабола со сдвинутой вершиной в (2; 0); Б — прямая, убывающая; В — гипербола.'
  },
  { id:'fg6',
    fns:[
      { letter:'А', tex:'y = -\\dfrac{1}{2}x + 4', fn:x => -0.5*x + 4, range:[-4, 8, -2, 7] },
      { letter:'Б', tex:'y = x^2 - 2x + 1', fn:x => (x-1)*(x-1), range:[-2, 4, -1, 10] },
      { letter:'В', tex:'y = \\dfrac{4}{x}', fn:x => 4/x, range:[-5, 5, -8, 8] }
    ],
    answer:[2, 1, 3],
    note:'А — прямая с отрицательным наклоном; Б — парабола, вершина в (1; 0); В — гипербола.'
  },
  { id:'fg7',
    fns:[
      { letter:'А', tex:'y = -x^2 + 4', fn:x => -x*x + 4, range:[-4, 4, -8, 5] },
      { letter:'Б', tex:'y = 2x', fn:x => 2*x, range:[-3, 3, -7, 7] },
      { letter:'В', tex:'y = -\\dfrac{2}{x}', fn:x => -2/x, range:[-5, 5, -8, 8] }
    ],
    answer:[1, 2, 3],
    note:'А — парабола ветви вниз, вершина (0; 4); Б — прямая через начало координат; В — гипербола в II и IV четвертях.'
  },
  { id:'fg8',
    fns:[
      { letter:'А', tex:'y = x^2 + 1', fn:x => x*x + 1, range:[-3, 3, 0, 11] },
      { letter:'Б', tex:'y = \\dfrac{x}{2} + 1', fn:x => x/2 + 1, range:[-3, 5, -1, 5] },
      { letter:'В', tex:'y = \\dfrac{3}{x}', fn:x => 3/x, range:[-5, 5, -7, 7] }
    ],
    answer:[1, 2, 3],
    note:'А — парабола, минимум в (0; 1); Б — прямая, $k = \\frac{1}{2}$, $b = 1$; В — гипербола.'
  },
  { id:'fg9',
    fns:[
      { letter:'А', tex:'y = 0{,}5 x^2', fn:x => 0.5*x*x, range:[-4, 4, -1, 9] },
      { letter:'Б', tex:'y = -\\dfrac{5}{x}', fn:x => -5/x, range:[-5, 5, -8, 8] },
      { letter:'В', tex:'y = -3x + 6', fn:x => -3*x + 6, range:[-2, 4, -7, 13] }
    ],
    answer:[1, 3, 2],
    note:'А — узкая парабола ветви вверх; Б — гипербола в "минусовых" четвертях; В — прямая, убывающая.'
  },
  { id:'fg10',
    fns:[
      { letter:'А', tex:'y = (x+1)^2 - 4', fn:x => (x+1)*(x+1) - 4, range:[-5, 3, -5, 11] },
      { letter:'Б', tex:'y = \\dfrac{2}{x}', fn:x => 2/x, range:[-5, 5, -7, 7] },
      { letter:'В', tex:'y = x - 1', fn:x => x - 1, range:[-3, 5, -5, 5] }
    ],
    answer:[1, 3, 2],
    note:'А — парабола со сдвинутой вершиной в (-1; -4); Б — гипербола в I и III четвертях; В — прямая с наклоном 1.'
  }
];

document.getElementById('stat-bank').textContent = QUESTIONS.length;

let state = { seen:new Set(), current:null, picks:[null,null,null], graphOrder:[1,2,3], solved:0, correct:0, streak:0, answered:false };

function pickQuestion(){
  const left = QUESTIONS.filter(q => !state.seen.has(q.id));
  if(left.length === 0){ state.seen.clear(); return QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]; }
  return left[Math.floor(Math.random()*left.length)];
}

function updateStats(){
  document.getElementById('stat-solved').textContent = state.solved;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-acc').textContent =
    state.solved === 0 ? '—' : Math.round(100 * state.correct / state.solved) + '%';
}

function rerenderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});
  }
}

function render(){
  const q = state.current;

  // Графики в порядке q.answer: graphSlot[i] = функция, которая должна быть на позиции i+1
  // То есть для функции А (idx 0) правильный график — q.answer[0]
  // Графики на экране нумеруются 1..3
  // graphSlot[graphNum-1] = индекс функции, чей график здесь нарисован
  const graphSlot = [-1, -1, -1];
  q.answer.forEach((g, fnIdx) => { graphSlot[g - 1] = fnIdx; });

  let fnsHtml = '<div class="functions">';
  q.fns.forEach(f => {
    fnsHtml += `<div class="function-item"><div class="function-letter">${f.letter})</div>$${f.tex}$</div>`;
  });
  fnsHtml += '</div>';

  let graphsHtml = '<div class="graphs">';
  for(let g = 1; g <= 3; g++){
    const fnIdx = graphSlot[g - 1];
    const fn = q.fns[fnIdx];
    graphsHtml += `<div class="graph-item"><div class="graph-num">${g})</div>${plotFn(fn.fn, fn.range[0], fn.range[1], fn.range[2], fn.range[3])}</div>`;
  }
  graphsHtml += '</div>';

  let matchHtml = '<div class="match-table">';
  q.fns.forEach((f, fi) => {
    let btns = '';
    for(let k = 1; k <= 3; k++){
      btns += `<button class="choice-btn" data-row="${fi}" data-val="${k}">${k}</button>`;
    }
    matchHtml += `<div class="match-row">
      <div class="match-letter">${f.letter})</div>
      <div class="match-fn">$${f.tex}$</div>
      <div class="choice-buttons">${btns}</div>
    </div>`;
  });
  matchHtml += '</div>';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="q-card">
      <span class="q-pill">соответствие</span>
      <p class="q-text">Установите соответствие между функциями и их графиками. Для каждой функции выберите номер графика.</p>
      <p style="font-size:14px;color:var(--muted);margin:8px 0 4px"><strong>Функции:</strong></p>
      ${fnsHtml}
      <p style="font-size:14px;color:var(--muted);margin:8px 0 4px"><strong>Графики:</strong></p>
      ${graphsHtml}
      ${matchHtml}
      <div id="feedback-area"></div>
      <div class="actions">
        <button class="primary" id="check" disabled>Проверить</button>
        <button class="secondary" id="next" disabled>Следующий →</button>
        <span class="right" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">ID: ${q.id}</span>
      </div>
    </div>
  `;
  rerenderMath(main);
  state.picks = [null, null, null];
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(state.answered) return;
      const r = +btn.dataset.row, v = +btn.dataset.val;
      state.picks[r] = v;
      document.querySelectorAll(`.choice-btn[data-row="${r}"]`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('check').disabled = state.picks.some(p => p === null);
    });
  });
  document.getElementById('check').addEventListener('click', check);
  document.getElementById('next').addEventListener('click', next);
  state.answered = false;
}

function check(){
  if(state.answered) return;
  const q = state.current;
  let countCorrect = 0;
  q.answer.forEach((corr, i) => {
    document.querySelectorAll(`.choice-btn[data-row="${i}"]`).forEach(btn => {
      btn.disabled = true;
      const v = +btn.dataset.val;
      if(v === corr) btn.classList.add('correct-mark');
      else if(v === state.picks[i]) btn.classList.add('wrong-mark');
    });
    if(state.picks[i] === corr) countCorrect++;
  });

  state.solved++;
  const ok = countCorrect === 3;
  if(ok){ state.correct++; state.streak++; } else { state.streak = 0; }
  state.answered = true;

  const fb = document.getElementById('feedback-area');
  const correctSeq = q.answer.join('');
  const userSeq = state.picks.join('');
  if(ok){
    fb.innerHTML = `<div class="feedback ok"><strong>Верно.</strong> Ответ: <code>${correctSeq}</code>.</div><div class="hint" id="hint">${q.note}</div>`;
  } else {
    fb.innerHTML = `<div class="feedback bad"><strong>Не точно.</strong> Правильный ответ: <code>${correctSeq}</code>, ваш: <code>${userSeq}</code>.</div><div class="hint" id="hint">${q.note}</div>`;
  }
  rerenderMath(document.getElementById('hint'));
  document.getElementById('check').disabled = true;
  document.getElementById('next').disabled = false;
  document.getElementById('next').focus();
  updateStats();
}

function next(){
  state.current = pickQuestion();
  state.seen.add(state.current.id);
  render();
}

next();
</script>
</body>
</html>
